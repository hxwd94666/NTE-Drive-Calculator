name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'hxwd94666' }}
    runs-on: macos-latest

    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: 'NTE_Drive_Calc_Setup_*.exe'
          mirrorchyan_rid: NTE-Drive-Calc
          tag: ${{ inputs.tag }}

          owner: hxwd94666
          repo: NTE-Drive-Calculator
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
