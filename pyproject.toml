[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "nte-drive-calculator"
dynamic = ["version"]
description = "《异环》驱动与卡带库存同步、鉴定、配装和自动化管理工具"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "NTE Drive Calc contributors" },
]
maintainers = [
    { name = "WuDu" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "keyboard>=0.13.5 ; sys_platform == 'win32'",
    "loguru>=0.7.0 ; sys_platform == 'win32'",
    "mss>=9.0.0 ; sys_platform == 'win32'",
    "numpy>=1.24.0 ; sys_platform == 'win32'",
    "opencv-python>=4.8.0 ; sys_platform == 'win32'",
    "pillow>=10.0.0 ; sys_platform == 'win32'",
    "pyautogui>=0.9.54 ; sys_platform == 'win32'",
    "pydantic>=2.0.0 ; sys_platform == 'win32'",
    "pypinyin>=0.50.0 ; sys_platform == 'win32'",
    "pyside6>=6.5.0 ; sys_platform == 'win32'",
    "scipy>=1.11.0 ; sys_platform == 'win32'",
    "vgamepad>=0.1.0 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/hxwd94666/NTE-Drive-Calc"
Issues = "https://github.com/hxwd94666/NTE-Drive-Calc/issues"
Releases = "https://github.com/hxwd94666/NTE-Drive-Calc/releases"

[dependency-groups]
# OCR 库按 profile 选择；CPU/DML 共享命名空间，不允许同时装入同一环境。
ocr-openvino = [
    "loguru>=0.7.0 ; sys_platform == 'win32'",
    "rapidocr-openvino==1.4.4 ; sys_platform == 'win32'",
]
ocr-onnx-cpu = [
    "loguru>=0.7.0 ; sys_platform == 'win32'",
    "rapidocr-onnxruntime==1.4.4 ; sys_platform == 'win32'",
    "onnxruntime>=1.7.0 ; sys_platform == 'win32'",
]
ocr-onnx-directml = [
    "loguru>=0.7.0 ; sys_platform == 'win32'",
    "rapidocr-onnxruntime==1.4.4 ; sys_platform == 'win32'",
    "onnxruntime-directml>=1.24.0 ; sys_platform == 'win32'",
]

build = [
    "pyinstaller>=6.0.0 ; sys_platform == 'win32'",
]
dev = [
    "coverage[toml]>=7.6.0",
    "mypy>=1.18.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.uv]
# 未选 profile 仍是 OpenVINO + ORT DirectML；普通 dev 工作流保持。
default-groups = ["dev", "ocr-openvino", "ocr-onnx-directml"]
conflicts = [[{ group = "ocr-onnx-cpu" }, { group = "ocr-onnx-directml" }]]

[tool.uv.dependency-groups]
ocr-openvino = { requires-python = ">=3.11,<3.13" }
ocr-onnx-cpu = { requires-python = ">=3.11,<3.13" }
ocr-onnx-directml = { requires-python = ">=3.11,<3.13" }

# 仅替代确切上游 wheel 的 CPU distribution 边，不改 wheel 字节或其余依赖。
# RapidOCR 消费 onnxruntime 命名空间；每个组显式提供 CPU 或 DirectML 分发。
# 原 wheel 的 pip check 仍报告 DirectML 场景缺 CPU，此为 uv resolver 专用替代。
[[tool.uv.dependency-metadata]]
name = "rapidocr-onnxruntime"
version = "1.4.4"
requires-python = ">=3.6,<3.13"
requires-dist = [
    "pyclipper>=1.2.0",
    "opencv-python>=4.5.1.48",
    "numpy<3.0.0,>=1.19.5",
    "six>=1.15.0",
    "Shapely!=2.0.4,>=1.7.1",
    "PyYAML",
    "Pillow",
    "tqdm",
]

[tool.setuptools.dynamic]
version = { attr = "src.app.version.__package_version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tools*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "build",
    "dist",
    "installer",
]

[tool.ruff.lint]
# M6 已完成首轮全仓未使用导入清理；语法、明显错误、未定义名称和 F401 均为硬门槛。
select = ["E9", "F63", "F7", "F821", "F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"
show_error_codes = true
pretty = true
exclude = [
    "^build/",
    "^dist/",
    "^installer/",
]

[tool.coverage.run]
branch = true
source = [
    "src/domain",
    "src/services",
    "src/storage/sqlite",
    "src/integrations",
]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
